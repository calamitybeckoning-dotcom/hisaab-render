name: wb
# Whiteboard draw-on renders (upstream letuandat131/whiteboard-animation-vi, CC0, pinned). Input and output are AES-256-CBC encrypted with the SCENE_KEY secret.
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "encrypted scene bundle path inside the repo"
        required: false
        default: "wb/scenes.bin"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg (static build from PyPI; the apt mirror was too slow)
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip imageio-ffmpeg
          FF="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          echo "FFMPEG_BINARY=$FF" >> "$GITHUB_ENV"
          "$FF" -hide_banner -encoders 2>/dev/null | grep -E "libx264 " || { echo "no libx264"; exit 1; }
      - name: Upstream tool (pinned)
        run: |
          git clone https://github.com/letuandat131/whiteboard-animation-vi.git upstream
          git -C upstream checkout c689bf7
      - name: Install (CPU torch) and model
        working-directory: upstream
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python scripts/download_model.py
      - name: Open the scene bundle
        env:
          SCENE_KEY: ${{ secrets.SCENE_KEY }}
          BUNDLE: ${{ inputs.bundle }}
        run: |
          mkdir -p upstream/in
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SCENE_KEY -in "$BUNDLE" | tar xzf - -C upstream/in
          ls upstream/in | head -50
      - name: Render every scene
        working-directory: upstream
        run: |
          python - <<'PY'
          import json, os, shutil, time
          import numpy as np
          from PIL import Image
          from handdraw.settings import Settings
          from handdraw.render import render_video
          os.makedirs("out", exist_ok=True)
          jobs = json.load(open("in/jobs.json"))
          for j in jobs:
              t0 = time.time()
              img = np.asarray(Image.open(f"in/{j['id']}.png").convert("RGB"))
              s = Settings(mode=j.get("mode", "d"), duration=float(j["duration"]), width=1280, height=720, fps=30,
                           draw_percent=float(j.get('draw', 80)), ink_percent=45, device="cpu", encoder="cpu")
              path, rep = render_video(img, s, output_dir="work")
              shutil.copy(path, f"out/{j['id']}.mp4")
              print(j["id"], j["duration"], "s ->", round(time.time() - t0, 1), "s wall", flush=True)
          PY
      - name: Seal the result
        env:
          SCENE_KEY: ${{ secrets.SCENE_KEY }}
        run: |
          mkdir -p pack
          tar cf - -C upstream/out . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SCENE_KEY -out pack/sealed-wb.enc
          ls -l pack
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-wb
          path: pack/sealed-wb.enc
          retention-days: 2
